[tool.poetry]
name = "kspec-gfa-controller"
version = "0.6.0"
description = "The Controller software for KSPEC-GFA Camera"
authors = ["Mingyeong Yang <mmingyeong@kasi.re.kr>"]
readme = "README.md"
packages = [{ include = "kspec_gfa_controller", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "1.26.4"
scipy = "1.13.1"
astropy = "7.1.1"
photutils = "2.0.2"
scikit-image = "0.22.0"
datetime = "5.5"
asyncio = "3.4.3"
pypylon = "4.0.0"
pillow = "10.0.0"

[tool.poetry.scripts]
set-permissions = "scripts.set_permissions:main"

[tool.poetry.group.dev.dependencies]
matplotlib = "^3.9.2"
ruff = "^0.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["E402"]
