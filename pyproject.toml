[project]
name = "kspec-gfa-controller"
version = "1.0.0"
description = "The Controller software for KSPEC-GFA Camera"
authors = [
    { name = "Mingyeong Yang", email = "mmingyeong@kasi.re.kr" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "astropy==7.1.1",
    "photutils==2.0.2",
    "scikit-image==0.22.0",
    "pypylon==4.0.0",
    "pillow==10.0.0",
    "PyYAML==6.0.3",
]

[project.scripts]
set-permissions = "scripts.set_permissions:main"

[tool.poetry]
packages = [
    { include = "kspec_gfa_controller", from = "src" }
]

[tool.poetry.group.dev.dependencies]
matplotlib = "3.11.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-asyncio = "1.4.0"
ruff = "0.16.6"

[tool.ruff.lint]
ignore = ["E402"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"